server:
  shutdown: graceful
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: payment-processing-simulator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${SPRING_DATASOURCE_USERNAME:payments}
    password: ${SPRING_DATASOURCE_PASSWORD:payments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    connect-retries: 10
    connect-retries-interval: 3s
  lifecycle:
    timeout-per-shutdown-phase: 20s

payments:
  provider: ${PAYMENTS_PROVIDER:simulated}
  demo:
    enabled: ${DEMO_ENABLED:false}
    session-seconds: ${DEMO_SESSION_SECONDS:21600}
    empty-session-seconds: ${DEMO_EMPTY_SESSION_SECONDS:1800}
    max-sessions: ${DEMO_MAX_SESSIONS:3000}
    max-payouts: ${DEMO_MAX_PAYOUTS:40}
    admissions-per-minute: ${DEMO_ADMISSIONS_PER_MINUTE:30}
    turnstile-required: ${TURNSTILE_REQUIRED:false}
    turnstile-site-key: ${TURNSTILE_SITE_KEY:}
    turnstile-secret: ${TURNSTILE_SECRET_KEY:}
    turnstile-hostname: ${TURNSTILE_HOSTNAME:}
    mastercard-calls-per-session: ${DEMO_MASTERCARD_CALLS_PER_SESSION:10}
    mastercard-calls-per-minute: ${DEMO_MASTERCARD_CALLS_PER_MINUTE:12}
    mastercard-calls-per-day: ${DEMO_MASTERCARD_CALLS_PER_DAY:100}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    interval-ms: ${RECONCILIATION_INTERVAL_MS:30000}
    processing-stale-ms: ${RECONCILIATION_PROCESSING_STALE_MS:60000}
    backoff-base-ms: ${RECONCILIATION_BACKOFF_BASE_MS:30000}
    backoff-max-ms: ${RECONCILIATION_BACKOFF_MAX_MS:240000}
  visa:
    enabled: ${VISA_ENABLED:false}
    base-url: ${VISA_BASE_URL:https://sandbox.api.visa.com}
    user-id: ${VISA_USER_ID:}
    password: ${VISA_PASSWORD:}
    client-cert-base64: ${VISA_CERT_PEM_BASE64:}
    client-key-base64: ${VISA_KEY_PEM_BASE64:}
    mle-key-id: ${VISA_MLE_KEY_ID:}
    mle-server-cert-base64: ${VISA_MLE_SERVER_CERT_BASE64:}
    mle-private-key-base64: ${VISA_MLE_PRIVATE_KEY_BASE64:}
    acquiring-bin: ${VISA_ACQUIRING_BIN:408999}
    recipient-pan: ${VISA_RECIPIENT_PAN:4957030420210454}
    sender-account-number: ${VISA_SENDER_ACCOUNT_NUMBER:4653459515756154}
    business-application-id: ${VISA_BUSINESS_APPLICATION_ID:MD}
  mastercard:
    enabled: ${MASTERCARD_ENABLED:false}
    base-url: ${MASTERCARD_BASE_URL:https://sandbox.api.move.mastercard.com}
    partner-id: ${MASTERCARD_PARTNER_ID:}
    consumer-key: ${MASTERCARD_CONSUMER_KEY:}
    p12-path: ${MASTERCARD_P12_PATH:}
    key-alias: ${MASTERCARD_KEY_ALIAS:keyalias}
    key-password: ${MASTERCARD_KEY_PASSWORD:keystorepassword}
    sender-account-uri: ${MASTERCARD_SENDER_ACCOUNT_URI:}
    recipient-account-uri: ${MASTERCARD_RECIPIENT_ACCOUNT_URI:}
    payment-type: ${MASTERCARD_PAYMENT_TYPE:BDB}
    funding-source: ${MASTERCARD_FUNDING_SOURCE:}
    payment-origination-country: ${MASTERCARD_PAYMENT_ORIGINATION_COUNTRY:}
    transaction-time-zone: ${MASTERCARD_TRANSACTION_TIME_ZONE:}
    request-details-path: ${MASTERCARD_REQUEST_DETAILS_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
