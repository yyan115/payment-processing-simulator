name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payments
      SPRING_DATASOURCE_USERNAME: payments
      SPRING_DATASOURCE_PASSWORD: payments
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend and database invariants
        run: mvn --batch-mode verify
      - name: Verify frontend
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and start the complete runtime
        env:
          # The browser suite opens one workspace per test, faster than a visitor would.
          DEMO_ADMISSIONS_PER_MINUTE: 120
        run: |
          docker compose config --quiet
          docker compose up --build --detach postgres app
          python3 scripts/smoke-demo.py
      - name: Exercise the packaged app in Chromium
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run test:e2e --prefix frontend
      - name: Container diagnostics
        if: failure()
        run: docker compose logs app postgres
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Stop the runtime
        if: always()
        run: docker compose down --volumes --remove-orphans
