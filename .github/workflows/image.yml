name: Publish image
on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild picks up base image security fixes without any code change.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Runs only once the Azure sign-in variables exist, so a deployment is recorded only when one happens.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Container Apps
        id: deploy
        run: |
          az containerapp update \
            --name payment-simulator \
            --resource-group payment-simulator \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --output none
          fqdn=$(az containerapp show --name payment-simulator --resource-group payment-simulator \
            --query properties.configuration.ingress.fqdn --output tsv)
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "https://$fqdn/actuator/health" > /dev/null; then
              echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
              echo "Deployed ${{ github.sha }}"
              exit 0
            fi
            sleep 10
          done
          echo "The new revision did not become healthy" >&2
          exit 1
