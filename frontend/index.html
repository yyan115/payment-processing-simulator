<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta
      name="description"
      content="See how a payment platform handles lost requests, lost responses and unknown outcomes, with a simulated network or the Mastercard and Visa sandboxes."
    />
    <script>
      // Apply a saved preference before the first paint. Light is the default.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("payment-simulator-theme") === "dark"
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Payment Simulator</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
